<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnlineNote - 协作编辑器</title>
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
  <style>
    :root {
      --bg: #1e1e2e;
      --bg-secondary: #181825;
      --bg-tertiary: #11111b;
      --text: #cdd6f4;
      --text-bright: #f5f5f5;
      --text-dim: #6c7086;
      --accent: #89b4fa;
      --border: #313244;
      --highlight-bg: rgba(137, 180, 250, 0.1);
      --h1-color: #f38ba8;
      --h2-color: #fab387;
      --h3-color: #a6e3a1;
      --h4-color: #f9e2af;
      --h5-color: #bb9af7;
      --h6-color: #7dcfff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
  </style>
</head>
<body>
  <div class="editor-page">
    <div class="editor-header">
      <div class="editor-header-left">
        <a href="index.html" class="editor-btn" title="返回思维导图">← 导图</a>
        <span class="editor-header-title" id="docTitle">ALL.md</span>
      </div>
      <div class="editor-header-right">
        <div class="editor-mode-switch">
          <button class="editor-mode-btn active" data-mode="split">分屏</button>
          <button class="editor-mode-btn" data-mode="edit">编辑</button>
          <button class="editor-mode-btn" data-mode="preview">预览</button>
        </div>
        <div class="editor-collab-users" id="collabUsers"></div>
        <button class="editor-btn" id="btnOutline" title="大纲">☰</button>
        <button class="editor-btn" id="btnVersions" title="版本历史">📜</button>
        <button class="editor-btn primary" id="btnSave">保存</button>
      </div>
    </div>

    <div class="editor-toolbar" id="editorToolbar"></div>

    <div class="editor-body">
      <div class="editor-outline" id="editorOutline" style="display: none;">
        <div class="editor-outline-header">大纲</div>
        <div id="outlineContent"></div>
      </div>

      <div class="editor-split" id="editorSplit">
        <div class="editor-pane editor-pane-editor" id="editorPane">
          <div class="editor-pane-label">Markdown</div>
          <div class="editor-pane-content" id="editorContainer"></div>
        </div>
        <div class="editor-resizer" id="editorResizer"></div>
        <div class="editor-pane" id="previewPane">
          <div class="editor-pane-label">预览</div>
          <div class="editor-preview" id="previewContainer"></div>
        </div>
      </div>
    </div>

    <div class="editor-footer">
      <div class="editor-footer-left">
        <span id="cursorInfo">行 1, 列 1</span>
        <span id="charCount">0 字符</span>
        <span id="lineCount">0 行</span>
      </div>
      <div class="editor-footer-right">
        <div class="editor-save-status">
          <div class="editor-save-dot" id="saveDot"></div>
          <span id="saveStatus">已保存</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11"></script>
  <script type="module">
    import { Editor } from './js/editor/Editor.js';
    import { Toolbar } from './js/editor/Toolbar.js';
    import { Outline } from './js/editor/Outline.js';
    import { LivePreview } from './js/renderer/LivePreview.js';
    import { SyncScroll } from './js/renderer/SyncScroll.js';
    import { CollaborationManager } from './js/collaboration/CollaborationManager.js';

    class EditorApp {
      constructor() {
        this.editor = null;
        this.preview = null;
        this.toolbar = null;
        this.outline = null;
        this.syncScroll = null;
        this.collab = null;
        this.mode = 'split';
        this.outlineVisible = false;
        this.saveStatus = 'saved';
        this.lastSavedContent = '';
        this.docId = 'all-md';
        this.versions = [];
        this.selectedVersion = null;
        this.crdtEnabled = crdtEnabledFromServer;
      }

      async init() {
        const params = new URLSearchParams(window.location.search);
        const docId = params.get('doc') || 'all-md';
        this.docId = docId;
        const targetSlug = params.get('slug') || '';
        const srcPath = params.get('src') || '';

        const titleText = srcPath
          ? srcPath.split('/').pop().replace(/\.md$/, '')
          : (docId === 'all-md' ? 'ALL.md' : docId.replace(/--/g, '/'));
        document.getElementById('docTitle').textContent = titleText;

        let initialContent = '';
        let crdtEnabledFromServer = true;
        try {
          let apiUrl = `/api/documents/${encodeURIComponent(docId)}`;
          if (srcPath) apiUrl += `?src=${encodeURIComponent(srcPath)}`;
          const resp = await fetch(apiUrl);
          if (resp.ok) {
            const data = await resp.json();
            initialContent = data.content || '';
            // Server controls CRDT mode — client MUST NOT toggle it.
            crdtEnabledFromServer = data.crdtEnabled !== false;
          }
        } catch (e) {
          try {
            const fallbackPath = srcPath || 'ALL.md';
            const resp = await fetch(fallbackPath);
            if (resp.ok) initialContent = await resp.text();
          } catch (e2) {
            console.warn('Could not load document');
          }
        }

        this.lastSavedContent = initialContent;

        const draftKey = `onlinenote-draft-${docId}`;
        const draft = localStorage.getItem(draftKey);
        if (draft && draft !== initialContent) {
          const useDraft = confirm('检测到未保存的草稿，是否恢复？');
          if (useDraft) {
            initialContent = draft;
          }
          localStorage.removeItem(draftKey);
        }

        this.editor = new Editor(document.getElementById('editorContainer'), {
          content: initialContent,
          onChange: (content) => this.onContentChange(content),
          onChanges: (changes) => this.onLocalChanges(changes),
          onCRDTOps: (changes) => this.onCRDTLocalChanges(changes),
          onSave: (content) => this.saveDocument(content),
          onCursorChange: (pos) => this.onCursorChange(pos),
        });
        await this.editor.init();
        this.editor.enableCRDT(this.crdtEnabled);

        this.preview = new LivePreview(document.getElementById('previewContainer'));
        await this.preview.init();
        this.preview.setBaseSrcPath(srcPath);
        this.preview.render(initialContent);

        this.toolbar = new Toolbar(document.getElementById('editorToolbar'), this.editor);
        this.toolbar.render();

        this.outline = new Outline(document.getElementById('outlineContent'), this.editor);
        this.outline.update();

        this.syncScroll = new SyncScroll(this.editor, this.preview);
        this.syncScroll.init();

        this.initCollaboration(docId);
        this.setupUI();
        this.updateStats(initialContent);

        if (targetSlug) {
          this.navigateToSlug(initialContent, targetSlug);
        }
      }

      initCollaboration(docId) {
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${location.host}/ws`;

        this.collab = new CollaborationManager({
          docId,
          crdtEnabled: this.crdtEnabled,
          onUserList: (users) => this.updateCollabUsers(users),
          onUserJoin: (msg) => console.log('User joined:', msg.userName),
          onUserLeave: (msg) => console.log('User left:', msg.userId),
          onRemoteEdit: (msg) => {
            if (this.crdtEnabled) return;
            try {
              const data = typeof msg.data === 'string' ? JSON.parse(msg.data) : msg.data;
              if (data.changes && data.changes.length > 0) {
                this.editor.applyChanges(data.changes);
              } else if (data.fullContent !== undefined) {
                this.editor.setContent(data.fullContent);
              }
            } catch (e) {}
          },
          onCRDTUpdate: (newContent) => {
            // Legacy full-content callback — kept for compatibility.
            // Prefer onCRDTChanges for incremental updates.
          },
          onCRDTChanges: (changes) => {
            this.editor.applyCRDTChanges(changes);
            const content = this.editor.getContent();
            this.preview.render(content);
            this.outline.update();
            this.updateStats(content);
          },
        });

        if (this.crdtEnabled) {
          this.collab.initCRDT(this.lastSavedContent);
        }

        this.collab.connect(wsUrl);
      }

      updateCollabUsers(users) {
        const container = document.getElementById('collabUsers');
        container.innerHTML = users.map(u => `
          <div class="editor-collab-avatar" style="background:${u.color}" title="${u.userName}">
            ${u.userName.charAt(0).toUpperCase()}
          </div>
        `).join('');
      }

      onContentChange(content) {
        this.preview.render(content);
        this.outline.update();
        if (this.syncScroll) this.syncScroll.update();
        this.updateStats(content);
        this.setSaveStatus('unsaved');
      }

      onLocalChanges(changes) {
        if (this.crdtEnabled) return;
        if (this.collab) {
          this.collab.sendChanges(changes);
        }
      }

      onCRDTLocalChanges(changes) {
        if (!this.crdtEnabled) return;
        if (this.collab) {
          this.collab.handleLocalChanges(changes);
        }
      }

      onCursorChange(pos) {
        document.getElementById('cursorInfo').textContent = `行 ${pos.line}, 列 ${pos.column}`;
      }

      navigateToSlug(content, slug) {
        const lines = content.split('\n');
        const slugify = (text) => text.trim().toLowerCase()
          .replace(/[^\w\u4e00-\u9fff]+/g, '-')
          .replace(/^-+|-+$/g, '');

        let targetLine = 0;
        let lastHeadingLevel = 0;
        let counter = {};

        for (let i = 0; i < lines.length; i++) {
          const m = lines[i].match(/^(#{1,6})\s+(.+)$/);
          if (m) {
            const level = m[1].length;
            const text = m[2].trim();
            lastHeadingLevel = level;
            const base = slugify(text);
            if (!counter[base]) counter[base] = 0;
            counter[base]++;
            const s = counter[base] > 1 ? base + '-' + counter[base] : base;
            if (s === slug) {
              targetLine = i + 1;
              break;
            }
          } else {
            const sm = lines[i].match(/^<summary>(.+?)<\/summary>/);
            if (sm) {
              const text = sm[1].trim();
              const level = lastHeadingLevel + 1;
              const base = slugify(text);
              if (!counter[base]) counter[base] = 0;
              counter[base]++;
              const s = counter[base] > 1 ? base + '-' + counter[base] : base;
              if (s === slug) {
                targetLine = i + 1;
                break;
              }
            }
          }
        }

        if (targetLine > 0) {
          setTimeout(() => {
            this.editor.scrollToLine(targetLine);
            this.showOutline();
          }, 500);
        }
      }

      showOutline() {
        this.outlineVisible = true;
        document.getElementById('editorOutline').style.display = '';
        document.getElementById('btnOutline').classList.add('active');
        this.outline.update();
      }

      updateStats(content) {
        document.getElementById('charCount').textContent = `${content.length} 字符`;
        const lines = content.split('\n').length;
        document.getElementById('lineCount').textContent = `${lines} 行`;
      }

      setSaveStatus(status) {
        const dot = document.getElementById('saveDot');
        const label = document.getElementById('saveStatus');
        this.saveStatus = status;

        dot.className = 'editor-save-dot';
        if (status === 'saving') {
          dot.classList.add('saving');
          label.textContent = '保存中...';
        } else if (status === 'unsaved') {
          dot.classList.add('unsaved');
          label.textContent = '未保存';
        } else {
          label.textContent = '已保存';
        }
      }

      async saveDocument(content) {
        if (content === this.lastSavedContent) return;

        this.setSaveStatus('saving');

        try {
          const params = new URLSearchParams(window.location.search);
          const docId = params.get('doc') || 'all-md';
          const srcPath = params.get('src') || '';
          let apiUrl = `/api/documents/${encodeURIComponent(docId)}`;
          if (srcPath) apiUrl += `?src=${encodeURIComponent(srcPath)}`;
          const resp = await fetch(apiUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, userId: this.collab?.userId || 'anonymous' }),
          });

          if (resp.ok) {
            this.lastSavedContent = content;
            this.setSaveStatus('saved');
          } else {
            this.setSaveStatus('unsaved');
          }
        } catch (e) {
          const params = new URLSearchParams(window.location.search);
          const docId = params.get('doc') || 'all-md';
          localStorage.setItem(`onlinenote-draft-${docId}`, content);
          this.setSaveStatus('unsaved');
        }
      }

      setupUI() {
        document.getElementById('btnSave').addEventListener('click', () => {
          this.saveDocument(this.editor.getContent());
        });

        document.getElementById('btnOutline').addEventListener('click', () => {
          this.outlineVisible = !this.outlineVisible;
          document.getElementById('editorOutline').style.display = this.outlineVisible ? '' : 'none';
          document.getElementById('btnOutline').classList.toggle('active', this.outlineVisible);
        });

        document.getElementById('btnVersions').addEventListener('click', () => {
          this.openVersionModal();
        });

        document.getElementById('closeVersionModal').addEventListener('click', () => {
          this.closeVersionModal();
        });
        document.getElementById('btnCloseVersionModal').addEventListener('click', () => {
          this.closeVersionModal();
        });

        document.getElementById('btnRollback').addEventListener('click', () => {
          this.rollbackToVersion();
        });

        document.querySelectorAll('.editor-mode-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.editor-mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.setMode(btn.dataset.mode);
          });
        });

        this.setupResizer();

        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
            e.preventDefault();
            this.editor.wrapSelection('**');
          }
          if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
            e.preventDefault();
            this.editor.wrapSelection('*');
          }
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            this.toolbar.insertLink();
          }
        });
      }

      async openVersionModal() {
        const modal = document.getElementById('versionModal');
        modal.style.display = 'flex';

        try {
          const resp = await fetch(`/api/documents/${encodeURIComponent(this.docId)}/versions`);
          if (resp.ok) {
            const data = await resp.json();
            this.versions = data.database || [];
            this.renderVersionList();
          }
        } catch (e) {
          console.error('Failed to load versions:', e);
        }
      }

      closeVersionModal() {
        const modal = document.getElementById('versionModal');
        modal.style.display = 'none';
        this.selectedVersion = null;
        document.getElementById('versionCompare').style.display = 'none';
        document.getElementById('versionDetail').style.display = 'flex';
        document.getElementById('versionContent').textContent = '';
        document.getElementById('versionTitle').textContent = '选择一个版本查看详情';
        document.getElementById('btnRollback').style.display = 'none';
      }

      renderVersionList() {
        const container = document.getElementById('versionList');
        if (this.versions.length === 0) {
          container.innerHTML = '<div style="color: #6c7086; text-align: center; padding: 20px;">暂无版本历史</div>';
          return;
        }

        container.innerHTML = this.versions.map((v, idx) => `
          <div class="version-item" data-idx="${idx}" style="padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid #313244; background: #181825;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <span style="color: #cdd6f4; font-weight: 600;">v${v.version}</span>
              <span style="color: #6c7086; font-size: 12px;">${new Date(v.createdAt).toLocaleString()}</span>
            </div>
            <div style="color: #89b4fa; font-size: 12px;">${v.userId || 'anonymous'}</div>
          </div>
        `).join('');

        container.querySelectorAll('.version-item').forEach(item => {
          item.addEventListener('click', () => {
            const idx = parseInt(item.dataset.idx);
            this.selectVersion(idx);
          });
        });
      }

      selectVersion(idx) {
        this.selectedVersion = this.versions[idx];

        document.querySelectorAll('.version-item').forEach((item, i) => {
          if (i === idx) {
            item.style.background = 'rgba(137, 180, 250, 0.1)';
            item.style.borderColor = '#89b4fa';
          } else {
            item.style.background = '#181825';
            item.style.borderColor = '#313244';
          }
        });

        document.getElementById('versionTitle').textContent = `v${this.selectedVersion.version} - ${new Date(this.selectedVersion.createdAt).toLocaleString()}`;
        document.getElementById('versionContent').textContent = this.selectedVersion.content;
        document.getElementById('versionDetail').style.display = 'flex';
        document.getElementById('versionCompare').style.display = 'none';
        document.getElementById('btnRollback').style.display = 'inline-block';

        if (idx < this.versions.length - 1) {
          this.showVersionCompare(idx);
        }
      }

      showVersionCompare(idx) {
        const oldV = this.versions[idx + 1];
        const newV = this.versions[idx];

        document.getElementById('versionOld').textContent = oldV.content;
        document.getElementById('versionNew').textContent = newV.content;
        document.getElementById('versionCompare').style.display = 'flex';
        document.getElementById('versionDetail').style.display = 'none';
      }

      async rollbackToVersion() {
        if (!this.selectedVersion) return;

        if (!confirm(`确定要回滚到版本 v${this.selectedVersion.version} 吗？`)) {
          return;
        }

        try {
          const resp = await fetch(`/api/documents/${encodeURIComponent(this.docId)}/rollback/${this.selectedVersion.version}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: this.collab?.userId || 'anonymous' }),
          });

          if (resp.ok) {
            const newVersion = await resp.json();
            const content = this.selectedVersion.content;
            this.editor.setContent(content);
            this.lastSavedContent = content;
            this.preview.render(content);
            this.setSaveStatus('saved');
            if (this.crdtEnabled && this.collab) {
              this.collab.initCRDT(content);
            }
            this.closeVersionModal();
            alert(`已成功回滚到版本 v${this.selectedVersion.version}`);
          } else {
            alert('回滚失败，请稍后重试');
          }
        } catch (e) {
          console.error('Failed to rollback:', e);
          alert('回滚失败，请稍后重试');
        }
      }

      setMode(mode) {
        this.mode = mode;
        const editorPane = document.getElementById('editorPane');
        const previewPane = document.getElementById('previewPane');
        const resizer = document.getElementById('editorResizer');

        editorPane.style.display = '';
        previewPane.style.display = '';
        resizer.style.display = '';

        if (mode === 'edit') {
          previewPane.style.display = 'none';
          resizer.style.display = 'none';
        } else if (mode === 'preview') {
          editorPane.style.display = 'none';
          resizer.style.display = 'none';
        }
      }

      setupResizer() {
        const resizer = document.getElementById('editorResizer');
        const split = document.getElementById('editorSplit');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
          isResizing = true;
          resizer.classList.add('active');
          document.body.style.cursor = 'col-resize';
          document.body.style.userSelect = 'none';
          e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
          if (!isResizing) return;
          const rect = split.getBoundingClientRect();
          const ratio = (e.clientX - rect.left) / rect.width;
          const clamped = Math.max(0.2, Math.min(0.8, ratio));
          const editorPane = document.getElementById('editorPane');
          const previewPane = document.getElementById('previewPane');
          editorPane.style.flex = `${clamped}`;
          previewPane.style.flex = `${1 - clamped}`;
        });

        document.addEventListener('mouseup', () => {
          if (isResizing) {
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
          }
        });
      }
    }

    const app = new EditorApp();
    app.init().catch(err => {
      console.error('Failed to initialize editor:', err);
    });
  </script>

  <div id="versionModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: #1e1e2e; border-radius: 12px; width: 90%; max-width: 1000px; max-height: 85vh; display: flex; flex-direction: column;">
      <div style="padding: 16px 20px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; color: #cdd6f4; font-size: 18px;">版本历史</h2>
        <button id="closeVersionModal" style="background: none; border: none; color: #6c7086; font-size: 24px; cursor: pointer;">&times;</button>
      </div>
      <div style="display: flex; flex: 1; overflow: hidden;">
        <div id="versionList" style="width: 30%; border-right: 1px solid #313244; overflow-y: auto; padding: 12px;"></div>
        <div style="width: 70%; display: flex; flex-direction: column;">
          <div id="versionCompare" style="display: none; flex: 1; flex-direction: row; overflow: hidden;">
            <div style="width: 50%; padding: 16px; border-right: 1px solid #313244; overflow-y: auto;">
              <div style="color: #f38ba8; font-weight: 600; margin-bottom: 12px;">旧版本</div>
              <pre id="versionOld" style="white-space: pre-wrap; color: #cdd6f4; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6;"></pre>
            </div>
            <div style="width: 50%; padding: 16px; overflow-y: auto;">
              <div style="color: #a6e3a1; font-weight: 600; margin-bottom: 12px;">新版本</div>
              <pre id="versionNew" style="white-space: pre-wrap; color: #cdd6f4; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6;"></pre>
            </div>
          </div>
          <div id="versionDetail" style="flex: 1; padding: 16px; overflow-y: auto;">
            <div style="color: #cdd6f4; font-weight: 600; margin-bottom: 12px;" id="versionTitle">选择一个版本查看详情</div>
            <pre id="versionContent" style="white-space: pre-wrap; color: #cdd6f4; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6;"></pre>
          </div>
        </div>
      </div>
      <div style="padding: 12px 20px; border-top: 1px solid #313244; display: flex; justify-content: flex-end; gap: 12px;">
        <button id="btnRollback" style="display: none; padding: 8px 16px; background: #f38ba8; border: none; border-radius: 6px; color: #11111b; font-weight: 600; cursor: pointer;">回滚到此版本</button>
        <button id="btnCloseVersionModal" style="padding: 8px 16px; background: #313244; border: none; border-radius: 6px; color: #cdd6f4; cursor: pointer;">关闭</button>
      </div>
    </div>
  </div>
</body>
</html>
