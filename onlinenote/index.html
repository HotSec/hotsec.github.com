<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 - 思维导图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<style>
@font-face{font-family:'Virgil';src:url('https://excalidraw.com/Virgil.woff2') format('woff2');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--bg-secondary:#1a1d2e;--bg-tertiary:#252a3a;
  --text:#c8d1e0;--text-dim:#5a6578;--text-bright:#eef0f4;
  --accent:#6cb4ee;--accent-hover:#89c8f5;
  --border:#2e3446;--highlight-bg:rgba(108,180,238,0.1);
  --scrollbar:#2e3446;--scrollbar-hover:#4a5568;
  --h1-color:#e0af68;--h2-color:#6cb4ee;--h3-color:#9ece6a;
  --h4-color:#ff9e64;--h5-color:#bb9af7;--h6-color:#7dcfff;
  --modal-overlay:rgba(0,0,0,0.6);
  --link-color:rgba(108,180,238,0.25);
  --bubble-fill-opacity:0.15;
}
[data-theme="light"]{
  --bg:#f5f7fb;--bg-secondary:#ffffff;--bg-tertiary:#eef1f6;
  --text:#2c3e50;--text-dim:#8899aa;--text-bright:#1a202c;
  --accent:#4a7cf7;--accent-hover:#3a6ce0;
  --border:#dde2ea;--highlight-bg:rgba(74,124,247,0.08);
  --scrollbar:#c8cdd5;--scrollbar-hover:#a8b0bc;
  --h1-color:#c47a20;--h2-color:#3b7dd8;--h3-color:#3a9e5c;
  --h4-color:#e07830;--h5-color:#8b6cc0;--h6-color:#2ba8c9;
  --modal-overlay:rgba(255,255,255,0.75);
  --link-color:rgba(74,124,247,0.2);
  --bubble-fill-opacity:0.12;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}

.app{display:flex;flex-direction:column;height:100vh}

.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;min-height:44px;z-index:10;transition:background .3s}
.toolbar-left{display:flex;align-items:center;gap:12px}
.toolbar-title{font-size:16px;font-weight:600;color:var(--text-bright);letter-spacing:0.5px;transition:color .3s}
.toolbar-title span{color:var(--accent)}
.toolbar-right{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--highlight-bg)}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn .icon-sun,.btn .icon-moon{display:none}
:root .btn .icon-moon{display:block}
[data-theme="light"] .btn .icon-sun{display:block}
[data-theme="light"] .btn .icon-moon{display:none}

.search-wrap{position:relative;display:flex;align-items:center}
.search-input{width:180px;padding:5px 10px 5px 28px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text);font-size:12px;outline:none;transition:all .2s}
.search-input:focus{border-color:var(--accent);background:var(--bg-secondary);width:240px}
.search-input::placeholder{color:var(--text-dim)}
.search-icon{position:absolute;left:8px;width:14px;height:14px;fill:var(--text-dim);pointer-events:none}
.search-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;max-height:300px;overflow-y:auto;display:none;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.search-dropdown.show{display:block}
.search-item{padding:8px 12px;cursor:pointer;font-size:12px;color:var(--text);display:flex;align-items:center;gap:8px;transition:background .15s}
.search-item:hover{background:var(--highlight-bg);color:var(--accent)}
.search-item-level{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg-tertiary);color:var(--text-dim);flex-shrink:0}
.search-item-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-empty{padding:12px;text-align:center;color:var(--text-dim);font-size:12px}

.layout-switcher{display:flex;align-items:center;gap:1px;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--bg-tertiary)}
.layout-btn{display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border:none;border-radius:6px;background:transparent;color:var(--text-dim);font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap}
.layout-btn:hover{color:var(--text);background:var(--highlight-bg)}
.layout-btn.active{background:var(--accent);color:#fff;font-weight:600}
.layout-btn svg{width:14px;height:14px;fill:currentColor}

.mindmap-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);transition:background .3s}
#mindmap-svg{width:100%;height:100%;cursor:grab}
#mindmap-svg:active{cursor:grabbing}
.mindmap-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px}

.node-group{cursor:pointer}
.node-group:hover .node-bubble{filter:brightness(1.2)}
.node-group.search-highlight .node-bubble{stroke-width:3;filter:drop-shadow(0 0 6px var(--accent))}
.node-group.summary-node .node-bubble{stroke-dasharray:none}
.node-group.summary-node .node-bubble-text{font-style:italic}
.summary-icon{pointer-events:none;dominant-baseline:central;font-size:9px}
.node-bubble{transition:filter .2s}
.node-bubble-text{fill:var(--text-bright);pointer-events:none;dominant-baseline:central;transition:fill .3s}
.fold-badge{fill:var(--text-dim);font-size:8px;font-weight:700;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.link-path{fill:none;stroke-width:1.5;pointer-events:none}
.bracket-path{fill:none;stroke-width:2;pointer-events:none;stroke-linecap:round}
.sketch-path{fill:none;stroke-width:2;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}
.sketch-bubble{transition:filter .2s}
.hachure-path{pointer-events:none;opacity:0.35}
.file-link-indicator{pointer-events:none;dominant-baseline:central;font-size:8px;fill:var(--accent);opacity:0.7}

.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;animation:fade-in .2s ease}
.modal-overlay.active{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

.modal{width:90%;max-width:860px;max-height:85vh;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:modal-in .25s ease;transition:background .3s,width .3s,height .3s,max-width .3s,max-height .3s,border-radius .3s}
.modal.fullscreen{width:100%;max-width:100%;max-height:100vh;height:100vh;border-radius:0}
@keyframes modal-in{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-dim);overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.modal-breadcrumb-item{cursor:pointer;transition:color .2s}
.modal-breadcrumb-item:hover{color:var(--accent)}
.modal-breadcrumb-sep{color:var(--border);margin:0 2px}
.modal-breadcrumb-current{color:var(--accent);font-weight:500}
.modal-actions{display:flex;align-items:center;gap:4px;margin-left:12px;flex-shrink:0}
.modal-action-btn{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text-dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-action-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--highlight-bg)}
.modal-action-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-close{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text-dim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:4px}
.modal-close:hover{border-color:var(--accent);color:var(--accent);background:var(--highlight-bg)}

.modal-body{flex:1;overflow-y:auto;padding:20px 24px;position:relative}
.modal-edit-area{width:100%;height:100%;min-height:400px;background:var(--bg-tertiary);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:"SF Mono","Fira Code","Cascadia Code",monospace;font-size:13px;line-height:1.6;resize:none;outline:none;tab-size:2}
.modal-edit-area:focus{border-color:var(--accent)}

.markdown-body{max-width:780px}
.markdown-body h1{color:var(--h1-color);font-size:1.8em;border-bottom:1px solid var(--border);padding-bottom:8px;margin:20px 0 12px}
.markdown-body h2{color:var(--h2-color);font-size:1.5em;border-bottom:1px solid var(--border);padding-bottom:6px;margin:18px 0 10px}
.markdown-body h3{color:var(--h3-color);font-size:1.25em;margin:16px 0 8px}
.markdown-body h4{color:var(--h4-color);font-size:1.1em;margin:14px 0 6px}
.markdown-body h5{color:var(--h5-color);font-size:1em;margin:12px 0 4px}
.markdown-body h6{color:var(--h6-color);font-size:0.9em;margin:10px 0 4px}
.markdown-body p{margin:8px 0;line-height:1.7}
.markdown-body ul,.markdown-body ol{margin:8px 0;padding-left:24px}
.markdown-body li{margin:4px 0;line-height:1.6}
.markdown-body code{background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:0.88em;color:var(--accent)}
.markdown-body pre{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:12px 0;overflow-x:auto}
.markdown-body pre code{background:none;padding:0;color:var(--text);font-size:0.88em}
.markdown-body blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin:12px 0;background:var(--highlight-bg);border-radius:0 6px 6px 0}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body table{border-collapse:collapse;width:100%;margin:12px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--bg-tertiary);font-weight:600}
.markdown-body details{margin:8px 0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.markdown-body summary{padding:8px 12px;cursor:pointer;background:var(--bg-tertiary);color:var(--accent);font-weight:500;transition:background .2s}
.markdown-body summary:hover{background:var(--highlight-bg)}
.markdown-body details[open] summary{border-bottom:1px solid var(--border)}
.markdown-body details>div,.markdown-body details>p{padding:8px 12px}

.source-link{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--accent);font-size:12px;cursor:pointer;text-decoration:none;margin-bottom:12px;transition:all .2s}
.source-link:hover{border-color:var(--accent);background:var(--highlight-bg)}

.save-toast{position:absolute;top:12px;right:12px;background:var(--h3-color);color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none}
.save-toast.show{opacity:1}

.statusbar{display:flex;align-items:center;padding:4px 16px;background:var(--bg-secondary);border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0;min-height:28px;gap:16px;transition:background .3s}
.statusbar-item{display:flex;align-items:center;gap:4px}
.statusbar-dot{width:6px;height:6px;border-radius:50%;background:var(--h3-color)}

.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--text-dim);pointer-events:none;opacity:0;transition:opacity .5s;z-index:5}
.hint.show{opacity:1}

@media(max-width:768px){
  .modal{width:96%;max-height:90vh;border-radius:8px}
  .toolbar-right .btn span{display:none}
  .layout-btn span{display:none}
  .search-input{width:120px}
  .search-input:focus{width:160px}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="toolbar-title"><span>◉</span> 知识图谱</div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input class="search-input" id="search-input" placeholder="搜索标题..." />
        <div class="search-dropdown" id="search-dropdown"></div>
      </div>
    </div>
    <div class="toolbar-right">
      <div class="layout-switcher" id="layout-switcher">
        <button class="layout-btn active" data-layout="bracket" title="括号图">
          <svg viewBox="0 0 24 24"><path d="M3 3h4v2H5v14h2v2H3V3zm14 0h4v18h-4v-2h2V5h-2V3zM8 8h2v8H8V8zm3 0h2v8h-2V8zm3 0h2v8h-2V8z"/></svg>
          <span>括号</span>
        </button>
        <button class="layout-btn" data-layout="tree" title="鱼骨图">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M7 7l-4 5 4 5M17 7l4 5-4 5M7 12h10M3 12H1M23 12h-2M7 7V5M7 17v2M17 7V5M17 17v2"/></svg>
          <span>鱼骨</span>
        </button>
        <button class="layout-btn" data-layout="bubble" title="气泡图">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
          <span>气泡</span>
        </button>
        <button class="layout-btn" data-layout="sketch" title="手绘风格">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          <span>手绘</span>
        </button>
      </div>
      <button class="btn" id="btn-theme" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button class="btn" id="btn-expand-all" title="全部展开">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>展开</span>
      </button>
      <button class="btn" id="btn-collapse-all" title="全部折叠">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13H7v-2h10v2z"/></svg>
        <span>折叠</span>
      </button>
      <button class="btn" id="btn-fit" title="适应屏幕">
        <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>适应</span>
      </button>
      <button class="btn" id="btn-reset" title="重置视图">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        <span>重置</span>
      </button>
    </div>
  </div>

  <div class="mindmap-wrap">
    <svg id="mindmap-svg"></svg>
    <div class="mindmap-loading" id="loading">加载中...</div>
    <div class="hint" id="hint">单击展开/折叠，双击查看详情</div>
  </div>

  <div class="statusbar">
    <div class="statusbar-item"><div class="statusbar-dot"></div><span id="status-info">就绪</span></div>
    <div class="statusbar-item" id="status-path"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-breadcrumb" id="modal-breadcrumb"></div>
      <div class="modal-actions">
        <button class="modal-action-btn" id="btn-fullscreen" title="全屏">⛶</button>
        <button class="modal-action-btn" id="btn-edit" title="编辑">✎</button>
      </div>
      <button class="modal-close" id="modal-close" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="markdown-body" id="markdown-body"></div>
      <textarea class="modal-edit-area" id="modal-edit-area" style="display:none"></textarea>
      <div class="save-toast" id="save-toast">已保存</div>
    </div>
  </div>
</div>

<script>
(function(){
  var markdownText = '';
  var headings = [];
  var svgEl, gEl, zoom, rootHierarchy, treeData;
  var duration = 500;
  var currentLayout = localStorage.getItem('mindmap-layout') || 'bracket';
  var isEditing = false;
  var currentEditSlug = '';
  var highlightedSlug = null;
  var clickTimers = {};
  var mybookBase = '';

  var branchColors = ['#e0af68','#6cb4ee','#9ece6a','#ff9e64','#bb9af7','#7dcfff','#f7768e','#73daca'];

  function slugify(text){
    return text.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '') || 'heading';
  }

  function parseHeadings(text){
    var lines = text.split('\n');
    var result = [];
    var counter = {};
    var lastHeadingLevel = 0;
    lines.forEach(function(line, idx){
      var m = line.match(/^(#{1,6})\s+(.+)$/);
      if(m){
        var level = m[1].length;
        var t = m[2].trim();
        lastHeadingLevel = level;
        var base = slugify(t);
        if(!counter[base]) counter[base] = 0;
        counter[base]++;
        var slug = counter[base] > 1 ? base + '-' + counter[base] : base;
        result.push({level: level, text: t, slug: slug, line: idx, isSummary: false, mdLinks: []});
      } else {
        var sm = line.match(/^<summary>(.+?)<\/summary>/);
        if(sm){
          var t2 = sm[1].trim();
          var level2 = lastHeadingLevel + 1;
          var base2 = slugify(t2);
          if(!counter[base2]) counter[base2] = 0;
          counter[base2]++;
          var slug2 = counter[base2] > 1 ? base2 + '-' + counter[base2] : base2;
          var mdLinks = [];
          for(var k = idx + 1; k < lines.length; k++){
            var lk = lines[k];
            if(lk.trim() === '</details>') break;
            var linkRe = /\[📄[^\]]*\]\(([^)]+)\)/g;
            var lm;
            while((lm = linkRe.exec(lk)) !== null){
              mdLinks.push(lm[1]);
            }
          }
          result.push({level: level2, text: t2, slug: slug2, line: idx, isSummary: true, mdLinks: mdLinks});
        }
      }
    });
    return result;
  }

  function buildHeadingTree(hdgs){
    var rootName = '知识点总结';
    var rootSlug = 'root';
    if(hdgs.length > 0 && hdgs[0].level === 1){
      rootName = hdgs[0].text;
      rootSlug = hdgs[0].slug;
      hdgs = hdgs.slice(1);
    }
    var root = {name: rootName, slug: rootSlug, level: 0, children: [], isSummary: false};
    var stack = [root];
    hdgs.forEach(function(h){
      var node = {name: h.text, slug: h.slug, level: h.level, children: [], isSummary: h.isSummary, mdLinks: h.mdLinks || []};
      while(stack.length > 1 && stack[stack.length - 1].level >= node.level){
        stack.pop();
      }
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    });
    return root;
  }

  function getSectionContent(slug){
    if(slug === treeData.slug){
      return markdownText;
    }
    var heading = headings.find(function(h){ return h.slug === slug; });
    if(!heading) return '';
    var startLine = heading.line;
    var endLine = markdownText.split('\n').length;
    if(heading.isSummary){
      var lines = markdownText.split('\n');
      var inDetails = false;
      var contentLines = [];
      for(var i = startLine + 1; i < lines.length; i++){
        var l = lines[i];
        if(l.trim() === '</details>') break;
        contentLines.push(l);
      }
      var section = lines[startLine] + '\n' + contentLines.join('\n');
      return renderMarkdown(section);
    }
    for(var j = 0; j < headings.length; j++){
      if(headings[j].line > startLine && headings[j].level <= heading.level){
        endLine = headings[j].line;
        break;
      }
    }
    var section2 = markdownText.split('\n').slice(startLine, endLine).join('\n');
    return renderMarkdown(section2);
  }

  function renderMarkdown(text){
    marked.setOptions({
      highlight: function(code, lang){
        if(lang && hljs.getLanguage(lang)){
          try{return hljs.highlight(code, {language: lang}).value;}catch(e){}
        }
        try{return hljs.highlightAuto(code).value;}catch(e){}
        return code;
      },
      breaks: true, gfm: true
    });
    return marked.parse(text);
  }

  function getSectionMarkdown(slug){
    if(slug === treeData.slug) return markdownText;
    var heading = headings.find(function(h){ return h.slug === slug; });
    if(!heading) return '';
    var startLine = heading.line;
    var endLine = markdownText.split('\n').length;
    if(heading.isSummary){
      var lines = markdownText.split('\n');
      var contentLines = [];
      for(var i = startLine; i < lines.length; i++){
        if(lines[i].trim() === '</details>') break;
        contentLines.push(lines[i]);
      }
      return contentLines.join('\n');
    }
    for(var j = 0; j < headings.length; j++){
      if(headings[j].line > startLine && headings[j].level <= heading.level){
        endLine = headings[j].line;
        break;
      }
    }
    return markdownText.split('\n').slice(startLine, endLine).join('\n');
  }

  var mdPathCache = {};

  function resolveMdPath(slug){
    if(mdPathCache[slug] !== undefined) return mdPathCache[slug];
    var heading = headings.find(function(h){ return h.slug === slug; });
    if(!heading || !heading.isSummary || !heading.mdLinks || heading.mdLinks.length === 0){
      mdPathCache[slug] = null;
      return null;
    }
    var rawPath = heading.mdLinks[0];
    var resolved = rawPath.replace(/^\.\//, mybookBase + '/');
    mdPathCache[slug] = resolved;
    return resolved;
  }

  function resolveAllMdLinks(slug){
    var heading = headings.find(function(h){ return h.slug === slug; });
    if(!heading || !heading.isSummary || !heading.mdLinks) return [];
    return heading.mdLinks.map(function(p){
      return p.replace(/^\.\//, mybookBase + '/');
    });
  }

  function findPathToSlug(targetSlug){
    var path = [];
    function find(node, current){
      var newPath = current.concat([{text: node.name, slug: node.slug}]);
      if(node.slug === targetSlug){
        path = newPath;
        return true;
      }
      if(node.children){
        for(var i = 0; i < node.children.length; i++){
          if(find(node.children[i], newPath)) return true;
        }
      }
      return false;
    }
    find(treeData, []);
    return path;
  }

          linksDiv.style.cssText = 'margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;';

  function getNodeColor(d){
    if(d.depth === 0) return 'var(--accent)';
    var topAncestor = d;
    while(topAncestor.parent && topAncestor.parent.depth > 0) topAncestor = topAncestor.parent;
    if(topAncestor.parent){
      var siblings = topAncestor.parent.children || [];
      var idx = siblings.indexOf(topAncestor);
      return branchColors[idx % branchColors.length];
    }
    return 'var(--accent)';
  }

  function getNodeColorHex(d){
    if(d.depth === 0) return '#6cb4ee';
    var topAncestor = d;
    while(topAncestor.parent && topAncestor.parent.depth > 0) topAncestor = topAncestor.parent;
    if(topAncestor.parent){
      var siblings = topAncestor.parent.children || [];
      var idx = siblings.indexOf(topAncestor);
      return branchColors[idx % branchColors.length];
    }
    return '#6cb4ee';
  }

  function collapseAll(d){
    if(d.children){
      d._children = d.children;
      d._children.forEach(collapseAll);
      d.children = null;
    }
  }

  function expandAll(d){
    if(d._children){
      d.children = d._children;
      d._children = null;
    }
    if(d.children) d.children.forEach(expandAll);
  }

  function toggleNode(d){
    if(d.children){
      d._children = d.children;
      d.children = null;
    } else if(d._children){
      d.children = d._children;
      d._children = null;
    }
    update(d);
  }

  function expandPathToNode(targetSlug){
    function expand(node){
      if(node.data.slug === targetSlug) return true;
      var kids = node.children || node._children;
      if(!kids) return false;
      for(var i = 0; i < kids.length; i++){
        if(expand(kids[i])){
          if(node._children){
            node.children = node._children;
            node._children = null;
          }
          return true;
        }
      }
      return false;
    }
    expand(rootHierarchy);
  }

  function radialPoint(x, y){
    return [(y = +y) * Math.cos(x -= Math.PI / 2), y * Math.sin(x)];
  }

  function truncateText(name, depth, isSummary){
    var maxLen = isSummary ? 10 : (depth <= 0 ? 20 : depth === 1 ? 14 : 10);
    return name.length > maxLen ? name.slice(0, maxLen) + '…' : name;
  }

  function countDescendants(children){
    var count = children.length;
    children.forEach(function(c){
      if(c.children) count += countDescendants(c.children);
      if(c._children) count += countDescendants(c._children);
    });
    return count;
  }

  function hexToRgba(hex, alpha){
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  function jitter(val, amount){
    return val + (Math.random() - 0.5) * amount;
  }

  function excalidrawRect(x, y, w, h){
    var j = function(v, a){ return v + (Math.random() - 0.5) * a; };
    var d = 'M' + j(x, 3) + ' ' + j(y, 3);
    d += ' C' + j(x + w*0.25, 4) + ' ' + j(y, 2.5);
    d += ' ' + j(x + w*0.75, 4) + ' ' + j(y, 2.5);
    d += ' ' + j(x + w, 3) + ' ' + j(y, 3);
    d += ' C' + j(x + w, 2.5) + ' ' + j(y + h*0.25, 4);
    d += ' ' + j(x + w, 2.5) + ' ' + j(y + h*0.75, 4);
    d += ' ' + j(x + w, 3) + ' ' + j(y + h, 3);
    d += ' C' + j(x + w*0.75, 4) + ' ' + j(y + h, 2.5);
    d += ' ' + j(x + w*0.25, 4) + ' ' + j(y + h, 2.5);
    d += ' ' + j(x, 3) + ' ' + j(y + h, 3);
    d += ' C' + j(x, 2.5) + ' ' + j(y + h*0.75, 4);
    d += ' ' + j(x, 2.5) + ' ' + j(y + h*0.25, 4);
    d += ' ' + j(x, 3) + ' ' + j(y, 3);
    d += ' Z';
    return d;
  }

  function hachureFill(x, y, w, h, gap, angle){
    gap = gap || 9;
    angle = angle || (-45 + (Math.random() - 0.5) * 8) * Math.PI / 180;
    var cos = Math.cos(angle);
    var sin = Math.sin(angle);
    var d = '';
    var cx = x + w/2;
    var cy = y + h/2;
    var diag = Math.sqrt(w*w + h*h);
    for(var offset = -diag/2; offset < diag/2; offset += gap + (Math.random()-0.5)*2){
      var x1 = cx + offset * cos - diag/2 * sin;
      var y1 = cy + offset * sin + diag/2 * cos;
      var x2 = cx + offset * cos + diag/2 * sin;
      var y2 = cy + offset * sin - diag/2 * cos;
      var clips = clipLine(x1, y1, x2, y2, x, y, w, h);
      if(clips){
        d += 'M' + jitter(clips[0],1.2) + ',' + jitter(clips[1],1.2);
        d += ' L' + jitter(clips[2],1.2) + ',' + jitter(clips[3],1.2) + ' ';
      }
    }
    return d || 'M0,0';
  }

  function clipLine(x1, y1, x2, y2, rx, ry, rw, rh){
    var codes = [0,0];
    var pts = [[x1,y1],[x2,y2]];
    for(var i = 0; i < 2; i++){
      if(pts[i][0] < rx) codes[i] |= 1;
      if(pts[i][0] > rx+rw) codes[i] |= 2;
      if(pts[i][1] < ry) codes[i] |= 4;
      if(pts[i][1] > ry+rh) codes[i] |= 8;
    }
    if((codes[0] | codes[1]) === 0) return [x1,y1,x2,y2];
    if((codes[0] & codes[1]) !== 0) return null;
    var dx = x2 - x1, dy = y2 - y1;
    for(var j = 0; j < 2; j++){
      if(codes[j] !== 0){
        var t;
        if(codes[j] & 8){ t = (ry+rh-y1)/dy; }
        else if(codes[j] & 4){ t = (ry-y1)/dy; }
        else if(codes[j] & 2){ t = (rx+rw-x1)/dx; }
        else { t = (rx-x1)/dx; }
        if(j === 0){ x1 += dx*t; y1 += dy*t; }
        else { x2 = x1+dx*t; y2 = y1+dy*t; }
      }
    }
    return [x1,y1,x2,y2];
  }

  function excalidrawCurve(x1, y1, x2, y2){
    var mx = (x1+x2)/2;
    var my = (y1+y2)/2;
    var dx = x2-x1, dy = y2-y1;
    var len = Math.sqrt(dx*dx+dy*dy) || 1;
    var bend = Math.min(len * 0.15, 20);
    var cpx = mx + dy/len * bend + jitter(0, 4);
    var cpy = my - dx/len * bend + jitter(0, 4);
    return 'M' + jitter(x1,1.5) + ',' + jitter(y1,1.5)
      + ' Q' + cpx + ',' + cpy + ' ' + jitter(x2,1.5) + ',' + jitter(y2,1.5);
  }

  function excalidrawPolyline(points){
    if(!points || points.length < 2) return '';
    var d = '';
    for(var i = 0; i < points.length - 1; i++){
      d += excalidrawCurve(points[i][0], points[i][1], points[i+1][0], points[i+1][1]);
    }
    return d;
  }

  function update(source){
    if(currentLayout === 'bracket') updateBracket(source);
    else if(currentLayout === 'tree') updateTree(source);
    else if(currentLayout === 'sketch') updateSketch(source);
    else updateBubble(source);
  }

  function bindNodeEvents(allNodes){
    allNodes.on('click', function(e, d){
      e.stopPropagation();
      var id = d.data.slug || d.data.name;
      if(clickTimers[id]){
        clearTimeout(clickTimers[id]);
        delete clickTimers[id];
        return;
      }
      clickTimers[id] = setTimeout(function(){
        delete clickTimers[id];
        if(d.data.isSummary && resolveMdPath(d.data.slug)){
          showModal(d.data.slug);
        } else if(d.children || d._children){
          toggleNode(d);
        } else if(d.data.slug){
          showModal(d.data.slug);
        }
      }, 250);
    });

    allNodes.on('dblclick', function(e, d){
      e.stopPropagation();
      e.preventDefault();
      var id = d.data.slug || d.data.name;
      if(clickTimers[id]){
        clearTimeout(clickTimers[id]);
        delete clickTimers[id];
      }
      if(d.data.slug){
        showModal(d.data.slug);
      }
    });
  }

  function assignFishbone(root, levelGap, leafGap){
    var nodes = root.descendants();
    nodes.forEach(function(d){
      d._fishSide = null;
      d._fishLeafIdx = 0;
    });
    var leftLeaves = [];
    var rightLeaves = [];
    function assign(node, side, depth){
      if(depth === 0){
        node.px = 0;
        node.py = 0;
        if(node.children){
          var half = Math.ceil(node.children.length / 2);
          node.children.forEach(function(child, i){
            assign(child, i < half ? 'left' : 'right', depth + 1);
          });
        }
      } else {
        node._fishSide = side;
        if(!node.children || node.children.length === 0){
          var arr = side === 'left' ? leftLeaves : rightLeaves;
          node._fishLeafIdx = arr.length;
          arr.push(node);
        } else {
          node.children.forEach(function(child){ assign(child, side, depth + 1); });
        }
        node.px = (side === 'left' ? -1 : 1) * depth * levelGap;
        node.py = 0;
      }
    }
    assign(root, null, 0);
    var maxLeaves = Math.max(leftLeaves.length, rightLeaves.length, 1);
    leftLeaves.forEach(function(leaf, i){ leaf.py = -(maxLeaves - 1) * leafGap / 2 + i * leafGap; });
    rightLeaves.forEach(function(leaf, i){ leaf.py = -(maxLeaves - 1) * leafGap / 2 + i * leafGap; });
    function propagateY(node){
      if(node.children && node.children.length > 0){
        node.children.forEach(propagateY);
        var ys = node.children.map(function(c){ return c.py; });
        node.py = (d3.min(ys) + d3.max(ys)) / 2;
      }
    }
    if(root.children) root.children.forEach(propagateY);
  }

  function fishLinkPath(d){
    var sx = d.source.px, sy = d.source.py;
    var tx = d.target.px, ty = d.target.py;
    var side = d.target._fishSide;
    var srcBX = d.source._fishBubbleX || 0;
    var srcBW = d.source._fishBubbleW || 60;
    var srcBH = d.source._fishBubbleH || 20;
    var tgtBX = d.target._fishBubbleX || 0;
    var tgtBW = d.target._fishBubbleW || 60;
    var tgtBH = d.target._fishBubbleH || 20;
    var srcEdge, tgtEdge;
    if(side === 'left'){
      srcEdge = sx + srcBX - 4;
      tgtEdge = tx + tgtBX + tgtBW + 4;
    } else {
      srcEdge = sx + srcBX + srcBW + 4;
      tgtEdge = tx + tgtBX - 4;
    }
    if(d.source.depth === 0){
      var r = 14;
      var dir = side === 'left' ? -1 : 1;
      var midX = (srcEdge + tgtEdge) / 2;
      var dy = ty - sy;
      var absDy = Math.abs(dy);
      if(absDy < r * 2) r = Math.max(absDy / 2, 2);
      var ydir = dy >= 0 ? 1 : -1;
      return 'M' + srcEdge + ',' + sy
        + ' H' + (midX - r * dir)
        + ' C' + midX + ',' + sy + ' ' + midX + ',' + sy + ' ' + midX + ',' + (sy + r * ydir)
        + ' V' + (ty - r * ydir)
        + ' C' + midX + ',' + ty + ' ' + midX + ',' + ty + ' ' + (midX + r * dir) + ',' + ty
        + ' H' + tgtEdge;
    }
    var midX2 = (srcEdge + tgtEdge) / 2;
    var srcY = sy, tgtY = ty;
    var cpOffset = Math.abs(tgtY - srcY) * 0.3;
    cpOffset = Math.min(cpOffset, 30);
    return 'M' + srcEdge + ',' + srcY
      + ' C' + midX2 + ',' + srcY + ' ' + midX2 + ',' + (srcY + cpOffset * (tgtY > srcY ? 1 : -1)) + ' ' + midX2 + ',' + ((srcY + tgtY) / 2)
      + ' S' + midX2 + ',' + tgtY + ' ' + tgtEdge + ',' + tgtY;
  }

  function renderFishNodes(allNodes, isSketch){
    allNodes.each(function(d){
      var g = d3.select(this);
      var colorHex = getNodeColorHex(d);
      var isFolded = !!d._children;
      var isSummary = d.data.isSummary;
      var fontSize = d.depth === 0 ? 15 : d.depth === 1 ? 13 : d.depth === 2 ? 12 : (isSummary ? 10 : 11);
      var text = truncateText(d.data.name, d.depth, isSummary);
      var paddingH = d.depth === 0 ? 14 : (isSummary ? 10 : 10);
      var paddingV = d.depth === 0 ? 8 : (isSummary ? 5 : 5);
      var side = d._fishSide;
      var anchor = d.depth === 0 ? 'middle' : (side === 'left' ? 'end' : 'start');

      g.classed('search-highlight', d.data.slug === highlightedSlug);
      g.classed('summary-node', isSummary);

      var iconEl = g.select('.summary-icon');
      if(iconEl.empty()) iconEl = g.append('text').attr('class','summary-icon');
      if(isSummary){
        iconEl.attr('x', side === 'left' ? -4 : 4)
          .attr('y', 0)
          .attr('text-anchor', side === 'left' ? 'end' : 'start')
          .text('▹');
      } else {
        iconEl.text('');
      }

      var textEl = g.select('.node-bubble-text');
      textEl
        .attr('font-size', fontSize + 'px')
        .attr('font-weight', isSummary ? '400' : (d.depth <= 1 ? '700' : '400'))
        .attr('text-anchor', anchor)
        .attr('x', 0).attr('y', 0)
        .text(text);

      var bbox;
      try{ bbox = textEl.node().getBBox(); }catch(e){ bbox = {x:0, width: text.length * fontSize * 0.6, height: fontSize}; }

      var bw = bbox.width + paddingH * 2;
      var bh = bbox.height + paddingV * 2;
      d._fishBubbleW = bw;
      d._fishBubbleH = bh;
      d._fishBubbleX = bbox.x - paddingH;

      var bubbleEl = g.select('.node-bubble');
      if(isSketch){
        bubbleEl.attr('d', excalidrawRect(bbox.x - paddingH, bbox.y - paddingV, bw, bh))
          .attr('fill', hexToRgba(colorHex, 0.01))
          .attr('stroke', colorHex)
          .attr('stroke-width', d.depth === 0 ? 2.5 : (isSummary ? 1.2 : 1.8))
          .attr('stroke-dasharray', isFolded ? '6,4' : 'none');

        var side=d.target._fishSide;
        var srcBX=d.source._fishBubbleX||0,srcBW=d.source._fishBubbleW||60;

        if(side==='left'){srcEdge=sx+srcBX-4;tgtEdge=tx+tgtBX+tgtBW+4;}
        else{srcEdge=sx+srcBX+srcBW+4;tgtEdge=tx+tgtBX-4;}
        if(d.source.depth===0){
          var r=14,dir=side==='left'?-1:1;
          var midX=(srcEdge+tgtEdge)/2;
          var dy=ty-sy,absDy=Math.abs(dy);
          if(absDy<r*2)r=Math.max(absDy/2,2);
          var ydir=dy>=0?1:-1;
          var pts=[[srcEdge,sy],[midX-r*dir,sy],[midX,sy+r*ydir]];
          if(absDy>r*2)pts.push([midX,ty-r*ydir]);
          pts.push([midX,ty],[midX+r*dir,ty],[tgtEdge,ty]);
          return excalidrawPolyline(pts);
        }
        var midX2=(srcEdge+tgtEdge)/2;
        var cpOff=Math.abs(ty-sy)*0.3;
        cpOff=Math.min(cpOff,30);
        var pts2=[[srcEdge,sy],[midX2,sy],[midX2,sy+cpOff*(ty>sy?1:-1)],[midX2,(sy+ty)/2],[midX2,ty],[tgtEdge,ty]];
        return excalidrawPolyline(pts2);

  function fitToScreen(){
    var svg = d3.select('#mindmap-svg');
    var width = svgEl.clientWidth;
    var height = svgEl.clientHeight;
    if(currentLayout === 'bubble'){
      var nodeCount = rootHierarchy.descendants().length;
      var radius = Math.max(Math.min(width, height) * 0.42, nodeCount * 5);
      var scale = Math.min(width, height) / 2 / (radius + 100);
      scale = Math.min(scale, 1.5);
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(scale));
    } else {
      var nodes = rootHierarchy.descendants();
      var xs = nodes.map(function(d){return d.px||0;}), ys = nodes.map(function(d){return d.py||0;});
      var minX=d3.min(xs),maxX=d3.max(xs),minY=d3.min(ys),maxY=d3.max(ys);
      var contentW=maxX-minX+400, contentH=maxY-minY+80;
      var midX=(minX+maxX)/2, midY=(minY+maxY)/2;
      var scale = Math.min(width/contentW, height/contentH, 1.5);
      scale = Math.max(scale, 0.1);
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width/2-midX*scale, height/2-midY*scale).scale(scale));
    }
  }

  function focusNode(slug){
    var nodes = rootHierarchy.descendants();
    var target = nodes.find(function(d){return d.data.slug===slug;});
    if(!target) return;
    var svg = d3.select('#mindmap-svg');
    var width = svgEl.clientWidth, height = svgEl.clientHeight;
    var scale = 1.2;
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(width/2-(target.px||0)*scale, height/2-(target.py||0)*scale).scale(scale));
  }

  function switchLayout(layout){
    if(layout === currentLayout) return;

    localStorage.setItem('mindmap-layout', layout);
    document.querySelectorAll('.layout-btn').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.layout===layout); });
    gEl.selectAll('.node-group,.link-path,.bracket-path,.sketch-path').remove();
    update(rootHierarchy);
    setTimeout(fitToScreen, duration + 50);
  }

  function initMindmap(){
    svgEl = document.getElementById('mindmap-svg');
    var width = svgEl.clientWidth, height = svgEl.clientHeight;
    var svg = d3.select('#mindmap-svg');
    zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', function(e){ gEl.attr('transform', e.transform); });
    svg.call(zoom);
    gEl = svg.append('g');

    treeData = buildHeadingTree(headings);
    rootHierarchy = d3.hierarchy(treeData);
    expandAll(rootHierarchy);
    rootHierarchy.children.forEach(function(child){ if(child.children) child.children.forEach(collapseAll); });
    rootHierarchy.x0 = 0; rootHierarchy.y0 = 0;

    update(rootHierarchy);
    fitToScreen();
    document.getElementById('loading').style.display = 'none';
    var hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(function(){ hint.classList.remove('show'); }, 5000);
  }

  function setupSearch(){
    var input = document.getElementById('search-input');
    var dropdown = document.getElementById('search-dropdown');
    input.addEventListener('input', function(){
      var query = input.value.trim().toLowerCase();
      if(!query){ dropdown.classList.remove('show'); dropdown.innerHTML=''; highlightedSlug=null; update(rootHierarchy); return; }
      var matches = headings.filter(function(h){ return h.text.toLowerCase().indexOf(query)!==-1; });
      if(matches.length===0){ dropdown.innerHTML='<div class="search-empty">未找到匹配项</div>'; dropdown.classList.add('show'); return; }
      var html = '';
      matches.slice(0,20).forEach(function(h){
        html += '<div class="search-item" data-slug="'+h.slug+'">'
          + '<span class="search-item-level">'+(h.isSummary?'S':'H'+h.level)+'</span>'
          + '<span class="search-item-text">'+h.text+'</span></div>';
      });
      dropdown.innerHTML = html;
      dropdown.classList.add('show');
      dropdown.querySelectorAll('.search-item').forEach(function(el){
        el.addEventListener('click', function(){
          var slug = el.dataset.slug;
          input.value = el.querySelector('.search-item-text').textContent;
          dropdown.classList.remove('show');
          highlightedSlug = slug;
          expandPathToNode(slug);
          update(rootHierarchy);
          setTimeout(function(){ focusNode(slug); }, duration + 50);
        });
      });
    });
    input.addEventListener('keydown', function(e){
      if(e.key==='Escape'){input.value='';dropdown.classList.remove('show');dropdown.innerHTML='';highlightedSlug=null;update(rootHierarchy);input.blur();}
    });
    document.addEventListener('click', function(e){ if(!e.target.closest('.search-wrap')) dropdown.classList.remove('show'); });
  }

  function setupToolbar(){
    document.querySelectorAll('.layout-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ switchLayout(btn.dataset.layout); });
    });
    document.getElementById('btn-expand-all').addEventListener('click', function(){
      expandAll(rootHierarchy); update(rootHierarchy); setTimeout(fitToScreen, duration+50);
    });
    document.getElementById('btn-collapse-all').addEventListener('click', function(){
      rootHierarchy.children.forEach(function(child){ collapseAll(child); });
      update(rootHierarchy); setTimeout(fitToScreen, duration+50);
    });
    document.getElementById('btn-fit').addEventListener('click', fitToScreen);
    document.getElementById('btn-reset').addEventListener('click', function(){
      expandAll(rootHierarchy);
      rootHierarchy.children.forEach(function(child){ if(child.children) child.children.forEach(collapseAll); });
      update(rootHierarchy); setTimeout(fitToScreen, duration+50);
    });
  }

  function setupModal(){
    document.getElementById('modal-close').addEventListener('click', hideModal);
    document.getElementById('modal-overlay').addEventListener('click', function(e){ if(e.target===this) hideModal(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') hideModal(); });

    document.getElementById('btn-fullscreen').addEventListener('click', function(){
      var modal = document.getElementById('modal');
      modal.classList.toggle('fullscreen');
      this.innerHTML = modal.classList.contains('fullscreen') ? '⊡' : '⛶';
    });

    document.getElementById('btn-edit').addEventListener('click', function(){
      var body = document.getElementById('modal-body');
      var mdBody = body.querySelector('.markdown-body');
      var editArea = body.querySelector('.modal-edit-area');
      if(!isEditing){
        isEditing = true;
        this.classList.add('active');
        this.innerHTML = '👁';
        this.title = '预览';
        editArea.value = getSectionMarkdown(currentEditSlug);
        editArea.style.display = '';
        mdBody.style.display = 'none';
      } else {
        var newContent = editArea.value;
        if(newContent !== getSectionMarkdown(currentEditSlug)){
          updateMarkdownContent(currentEditSlug, newContent);
          var toast = document.getElementById('save-toast');
          toast.classList.add('show');
          setTimeout(function(){ toast.classList.remove('show'); }, 1500);
        }
        isEditing = false;
        this.classList.remove('active');
        this.innerHTML = '✎';
        this.title = '编辑';
        mdBody.innerHTML = getSectionContent(currentEditSlug);
        editArea.style.display = 'none';
        mdBody.style.display = '';
      }
    });
  }

  function updateMarkdownContent(slug, newContent){
    if(slug === treeData.slug){
      markdownText = newContent;
    } else {
      var heading = headings.find(function(h){return h.slug===slug;});
      if(!heading) return;
      var startLine = heading.line;
      var endLine = markdownText.split('\n').length;
      for(var i=0;i<headings.length;i++){
        if(headings[i].line>startLine && headings[i].level<=heading.level){endLine=headings[i].line;break;}
      }
      var lines = markdownText.split('\n');
      lines.splice(startLine, endLine-startLine, newContent);
      markdownText = lines.join('\n');
    }
    headings = parseHeadings(markdownText);
    treeData = buildHeadingTree(headings);
    rootHierarchy = d3.hierarchy(treeData);
    expandAll(rootHierarchy);
    rootHierarchy.children.forEach(function(child){ if(child.children) child.children.forEach(collapseAll); });
    rootHierarchy.x0 = 0; rootHierarchy.y0 = 0;
    update(rootHierarchy);
  }

  function setupTheme(){
    var saved = localStorage.getItem('theme');
    if(saved){ document.documentElement.dataset.theme = saved; }
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
      document.documentElement.dataset.theme = 'light';
    }
    updateHljsTheme();
    document.getElementById('btn-theme').addEventListener('click', function(){
      var current = document.documentElement.dataset.theme;
      var next = current==='light'?'':'light';
      if(next){ document.documentElement.dataset.theme=next; localStorage.setItem('theme',next); }
      else { delete document.documentElement.dataset.theme; localStorage.setItem('theme','dark'); }
      updateHljsTheme();
    });
  }

  function updateHljsTheme(){
    var link = document.getElementById('hljs-theme');
    var isLight = document.documentElement.dataset.theme === 'light';
    link.href = isLight
      ? 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css'
      : 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css';
  }

  async function init(){
    try{
      try{
        var cfgResp = await fetch('config.json');
        if(cfgResp.ok){
          var cfg = await cfgResp.json();
          if(cfg.mybookBase) mybookBase = cfg.mybookBase;
        }
      }catch(e){ console.warn('config.json load failed, using defaults:', e); }

      var resp = await fetch('ALL.md');
      if(!resp.ok) throw new Error('Failed to load ALL.md: ' + resp.status);
      markdownText = await resp.text();
      headings = parseHeadings(markdownText);
      setupTheme();
      document.querySelectorAll('.layout-btn').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.layout===currentLayout); });
      initMindmap();
      setupToolbar();
      setupModal();
      setupSearch();
    } catch(err){
      document.getElementById('loading').textContent = '加载失败: ' + err.message;
      document.getElementById('status-info').textContent = '错误';
      console.error(err);
    }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
