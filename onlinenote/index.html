<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱 - 思维导图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--bg-secondary:#1a1d2e;--bg-tertiary:#252a3a;
  --text:#c8d1e0;--text-dim:#5a6578;--text-bright:#eef0f4;
  --accent:#6cb4ee;--accent-hover:#89c8f5;
  --border:#2e3446;--highlight-bg:rgba(108,180,238,0.1);
  --scrollbar:#2e3446;--scrollbar-hover:#4a5568;
  --h1-color:#e0af68;--h2-color:#6cb4ee;--h3-color:#9ece6a;
  --h4-color:#ff9e64;--h5-color:#bb9af7;--h6-color:#7dcfff;
  --modal-overlay:rgba(0,0,0,0.6);
  --link-color:rgba(108,180,238,0.25);
}
[data-theme="light"]{
  --bg:#f5f7fb;--bg-secondary:#ffffff;--bg-tertiary:#eef1f6;
  --text:#2c3e50;--text-dim:#8899aa;--text-bright:#1a202c;
  --accent:#4a7cf7;--accent-hover:#3a6ce0;
  --border:#dde2ea;--highlight-bg:rgba(74,124,247,0.08);
  --scrollbar:#c8cdd5;--scrollbar-hover:#a8b0bc;
  --h1-color:#c47a20;--h2-color:#3b7dd8;--h3-color:#3a9e5c;
  --h4-color:#e07830;--h5-color:#8b6cc0;--h6-color:#2ba8c9;
  --modal-overlay:rgba(255,255,255,0.75);
  --link-color:rgba(74,124,247,0.2);
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}

.app{display:flex;flex-direction:column;height:100vh}

.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-shrink:0;min-height:44px;z-index:10;transition:background .3s}
.toolbar-left{display:flex;align-items:center;gap:12px}
.toolbar-title{font-size:16px;font-weight:600;color:var(--text-bright);letter-spacing:0.5px;transition:color .3s}
.toolbar-title span{color:var(--accent)}
.toolbar-right{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--highlight-bg)}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn .icon-sun,.btn .icon-moon{display:none}
:root .btn .icon-moon{display:block}
[data-theme="light"] .btn .icon-sun{display:block}
[data-theme="light"] .btn .icon-moon{display:none}

.mindmap-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg);transition:background .3s}
#mindmap-svg{width:100%;height:100%;cursor:grab}
#mindmap-svg:active{cursor:grabbing}
.mindmap-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px}

.node-circle{cursor:pointer;transition:r .2s,fill .2s,stroke .2s}
.node-group:hover .node-circle{filter:brightness(1.3) drop-shadow(0 0 6px currentColor)}
.node-text{fill:var(--text);pointer-events:none;transition:fill .3s;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.link-path{fill:none;stroke-width:1.5;transition:stroke .3s}
.root-pulse{animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{r:14;opacity:1}50%{r:17;opacity:0.7}}
.fold-count{fill:var(--text-bright);font-size:8px;font-weight:700;pointer-events:none;text-anchor:middle;dominant-baseline:central}

.modal-overlay{position:fixed;inset:0;background:var(--modal-overlay);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;animation:fade-in .2s ease}
.modal-overlay.active{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

.modal{width:90%;max-width:860px;max-height:85vh;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:modal-in .25s ease;transition:background .3s}
@keyframes modal-in{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-breadcrumb{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-dim);overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.modal-breadcrumb-item{cursor:pointer;transition:color .2s}
.modal-breadcrumb-item:hover{color:var(--accent)}
.modal-breadcrumb-sep{color:var(--border);margin:0 2px}
.modal-breadcrumb-current{color:var(--accent);font-weight:500}
.modal-close{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text-dim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;margin-left:12px}
.modal-close:hover{border-color:var(--accent);color:var(--accent);background:var(--highlight-bg)}

.modal-body{flex:1;overflow-y:auto;padding:20px 24px}

.markdown-body{max-width:780px}
.markdown-body h1{color:var(--h1-color);font-size:1.8em;border-bottom:1px solid var(--border);padding-bottom:8px;margin:20px 0 12px}
.markdown-body h2{color:var(--h2-color);font-size:1.5em;border-bottom:1px solid var(--border);padding-bottom:6px;margin:18px 0 10px}
.markdown-body h3{color:var(--h3-color);font-size:1.25em;margin:16px 0 8px}
.markdown-body h4{color:var(--h4-color);font-size:1.1em;margin:14px 0 6px}
.markdown-body h5{color:var(--h5-color);font-size:1em;margin:12px 0 4px}
.markdown-body h6{color:var(--h6-color);font-size:0.9em;margin:10px 0 4px}
.markdown-body p{margin:8px 0;line-height:1.7}
.markdown-body ul,.markdown-body ol{margin:8px 0;padding-left:24px}
.markdown-body li{margin:4px 0;line-height:1.6}
.markdown-body code{background:var(--bg-tertiary);padding:2px 6px;border-radius:4px;font-size:0.88em;color:var(--accent)}
.markdown-body pre{background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin:12px 0;overflow-x:auto}
.markdown-body pre code{background:none;padding:0;color:var(--text);font-size:0.88em}
.markdown-body blockquote{border-left:3px solid var(--accent);padding:8px 16px;margin:12px 0;background:var(--highlight-bg);border-radius:0 6px 6px 0}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.markdown-body a{color:var(--accent);text-decoration:none}
.markdown-body a:hover{text-decoration:underline}
.markdown-body table{border-collapse:collapse;width:100%;margin:12px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--bg-tertiary);font-weight:600}
.markdown-body details{margin:8px 0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.markdown-body summary{padding:8px 12px;cursor:pointer;background:var(--bg-tertiary);color:var(--accent);font-weight:500;transition:background .2s}
.markdown-body summary:hover{background:var(--highlight-bg)}
.markdown-body details[open] summary{border-bottom:1px solid var(--border)}
.markdown-body details>div,.markdown-body details>p{padding:8px 12px}

.statusbar{display:flex;align-items:center;padding:4px 16px;background:var(--bg-secondary);border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);flex-shrink:0;min-height:28px;gap:16px;transition:background .3s}
.statusbar-item{display:flex;align-items:center;gap:4px}
.statusbar-dot{width:6px;height:6px;border-radius:50%;background:var(--h3-color)}

.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-secondary);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:12px;color:var(--text-dim);pointer-events:none;opacity:0;transition:opacity .5s;z-index:5}
.hint.show{opacity:1}

@media(max-width:768px){
  .modal{width:96%;max-height:90vh;border-radius:8px}
  .toolbar-right .btn span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="toolbar-title"><span>◉</span> 知识图谱</div>
    </div>
    <div class="toolbar-right">
      <button class="btn" id="btn-theme" title="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button class="btn" id="btn-expand-all" title="全部展开">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>展开</span>
      </button>
      <button class="btn" id="btn-collapse-all" title="全部折叠">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 13H7v-2h10v2z"/></svg>
        <span>折叠</span>
      </button>
      <button class="btn" id="btn-fit" title="适应屏幕">
        <svg viewBox="0 0 24 24"><path d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg>
        <span>适应</span>
      </button>
      <button class="btn" id="btn-reset" title="重置视图">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        <span>重置</span>
      </button>
    </div>
  </div>

  <div class="mindmap-wrap">
    <svg id="mindmap-svg"></svg>
    <div class="mindmap-loading" id="loading">加载中...</div>
    <div class="hint" id="hint">点击节点查看详情，点击圆圈展开/折叠</div>
  </div>

  <div class="statusbar">
    <div class="statusbar-item"><div class="statusbar-dot"></div><span id="status-info">就绪</span></div>
    <div class="statusbar-item" id="status-path"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-breadcrumb" id="modal-breadcrumb"></div>
      <button class="modal-close" id="modal-close" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="markdown-body" id="markdown-body"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var markdownText = '';
  var headings = [];
  var svgEl, gEl, zoom, rootHierarchy, treeData;
  var duration = 500;

  var branchColors = ['#e0af68','#6cb4ee','#9ece6a','#ff9e64','#bb9af7','#7dcfff','#f7768e','#73daca'];

  function slugify(text){
    return text.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '') || 'heading';
  }

  function parseHeadings(text){
    var lines = text.split('\n');
    var result = [];
    var counter = {};
    lines.forEach(function(line, idx){
      var m = line.match(/^(#{1,6})\s+(.+)$/);
      if(m){
        var level = m[1].length;
        var t = m[2].trim();
        var base = slugify(t);
        if(!counter[base]) counter[base] = 0;
        counter[base]++;
        var slug = counter[base] > 1 ? base + '-' + counter[base] : base;
        result.push({level: level, text: t, slug: slug, line: idx});
      }
    });
    return result;
  }

  function buildHeadingTree(hdgs){
    var root = {name: 'ALL', slug: '', level: 0, children: []};
    var stack = [root];
    hdgs.forEach(function(h){
      var node = {name: h.text, slug: h.slug, level: h.level, children: []};
      while(stack.length > 1 && stack[stack.length - 1].level >= node.level){
        stack.pop();
      }
      stack[stack.length - 1].children.push(node);
      stack.push(node);
    });
    return root;
  }

  function getSectionContent(slug){
    var heading = headings.find(function(h){ return h.slug === slug; });
    if(!heading) return '';
    var startLine = heading.line;
    var endLine = markdownText.split('\n').length;
    for(var i = 0; i < headings.length; i++){
      if(headings[i].line > startLine && headings[i].level <= heading.level){
        endLine = headings[i].line;
        break;
      }
    }
    var section = markdownText.split('\n').slice(startLine, endLine).join('\n');
    marked.setOptions({
      highlight: function(code, lang){
        if(lang && hljs.getLanguage(lang)){
          try{return hljs.highlight(code, {language: lang}).value;}catch(e){}
        }
        try{return hljs.highlightAuto(code).value;}catch(e){}
        return code;
      },
      breaks: true, gfm: true
    });
    return marked.parse(section);
  }

  function findPathToSlug(targetSlug){
    var path = [];
    function find(nodes, current){
      for(var i = 0; i < nodes.length; i++){
        var n = nodes[i];
        var newPath = current.concat([{text: n.name, slug: n.slug}]);
        if(n.slug === targetSlug){
          path = newPath;
          return true;
        }
        if(n.children && find(n.children, newPath)) return true;
      }
      return false;
    }
    find(treeData.children, []);
    return path;
  }

  function showModal(slug){
    var overlay = document.getElementById('modal-overlay');
    var body = document.getElementById('modal-body');
    var bc = document.getElementById('modal-breadcrumb');
    var content = getSectionContent(slug);
    body.querySelector('.markdown-body').innerHTML = content;
    var path = findPathToSlug(slug);
    var bcHTML = '';
    path.forEach(function(p, i){
      if(i > 0) bcHTML += '<span class="modal-breadcrumb-sep">/</span>';
      bcHTML += i === path.length - 1
        ? '<span class="modal-breadcrumb-current">' + p.text + '</span>'
        : '<span class="modal-breadcrumb-item" data-slug="' + p.slug + '">' + p.text + '</span>';
    });
    bc.innerHTML = bcHTML;
    bc.querySelectorAll('.modal-breadcrumb-item').forEach(function(el){
      el.addEventListener('click', function(){ showModal(el.dataset.slug); });
    });
    overlay.classList.add('active');
    body.scrollTop = 0;
    var heading = headings.find(function(h){ return h.slug === slug; });
    if(heading) document.getElementById('status-path').textContent = heading.text;
  }

  function hideModal(){
    document.getElementById('modal-overlay').classList.remove('active');
  }

  function getNodeColor(d){
    if(d.depth === 0) return 'var(--accent)';
    var topAncestor = d;
    while(topAncestor.parent && topAncestor.parent.depth > 0) topAncestor = topAncestor.parent;
    if(topAncestor.parent){
      var siblings = topAncestor.parent.children || [];
      var idx = siblings.indexOf(topAncestor);
      return branchColors[idx % branchColors.length];
    }
    return 'var(--accent)';
  }

  function getNodeColorHex(d){
    if(d.depth === 0) return '#6cb4ee';
    var topAncestor = d;
    while(topAncestor.parent && topAncestor.parent.depth > 0) topAncestor = topAncestor.parent;
    if(topAncestor.parent){
      var siblings = topAncestor.parent.children || [];
      var idx = siblings.indexOf(topAncestor);
      return branchColors[idx % branchColors.length];
    }
    return '#6cb4ee';
  }

  function collapseAll(d){
    if(d.children){
      d._children = d.children;
      d._children.forEach(collapseAll);
      d.children = null;
    }
  }

  function expandAll(d){
    if(d._children){
      d.children = d._children;
      d._children = null;
    }
    if(d.children) d.children.forEach(expandAll);
  }

  function toggleNode(d){
    if(d.children){
      d._children = d.children;
      d.children = null;
    } else if(d._children){
      d.children = d._children;
      d._children = null;
    }
    update(d);
  }

  function radialPoint(x, y){
    return [(y = +y) * Math.cos(x -= Math.PI / 2), y * Math.sin(x)];
  }

  function getTextOffset(d){
    if(d.depth === 0) return 0;
    return Math.max(14, 22 - d.depth * 3);
  }

  function truncateText(name, depth){
    var maxLen = depth <= 1 ? 14 : 10;
    return name.length > maxLen ? name.slice(0, maxLen) + '…' : name;
  }

  function countDescendants(children){
    var count = children.length;
    children.forEach(function(c){
      if(c.children) count += countDescendants(c.children);
      if(c._children) count += countDescendants(c._children);
    });
    return count;
  }

  function update(source){
    var width = svgEl.clientWidth;
    var height = svgEl.clientHeight;
    var nodeCount = rootHierarchy.descendants().length;
    var radius = Math.max(Math.min(width, height) * 0.42, nodeCount * 3.5);

    var treeLayout = d3.tree()
      .size([2 * Math.PI, radius])
      .separation(function(a, b){
        return (a.parent === b.parent ? 1.5 : 3) / Math.max(a.depth, 1);
      });

    var root = treeLayout(rootHierarchy);
    var nodes = root.descendants();
    var links = root.links();

    nodes.forEach(function(d){
      var p = radialPoint(d.x, d.y);
      d.px = p[0];
      d.py = p[1];
    });

    var linkSel = gEl.selectAll('.link-path')
      .data(links, function(d){ return d.target.data.name + d.target.depth; });

    linkSel.exit().transition().duration(duration)
      .attr('opacity', 0).remove();

    var linkEnter = linkSel.enter().append('path')
      .attr('class', 'link-path')
      .attr('opacity', 0)
      .attr('d', function(d){
        var sp = radialPoint(source.x0 || 0, source.y0 || 0);
        return d3.linkRadial().angle(function(dd){ return dd.x; }).radius(function(dd){ return dd.y; })({
          source: {x: source.x0 || 0, y: source.y0 || 0},
          target: {x: source.x0 || 0, y: source.y0 || 0}
        });
      });

    linkEnter.merge(linkSel)
      .transition().duration(duration)
      .attr('opacity', 1)
      .attr('d', d3.linkRadial().angle(function(d){ return d.x; }).radius(function(d){ return d.y; }))
      .attr('stroke', function(d){ return getNodeColor(d.source); })
      .attr('stroke-opacity', 0.35);

    var nodeSel = gEl.selectAll('.node-group')
      .data(nodes, function(d){ return d.data.name + d.depth; });

    nodeSel.exit().transition().duration(duration)
      .attr('transform', function(){
        var p = radialPoint(source.x, source.y);
        return 'translate(' + p[0] + ',' + p[1] + ')';
      })
      .attr('opacity', 0).remove();

    var nodeEnter = nodeSel.enter().append('g')
      .attr('class', 'node-group')
      .attr('transform', function(){
        var p = radialPoint(source.x0 || 0, source.y0 || 0);
        return 'translate(' + p[0] + ',' + p[1] + ')';
      })
      .attr('opacity', 0);

    nodeEnter.append('circle').attr('class', 'node-circle');
    nodeEnter.append('text').attr('class', 'node-text');
    nodeEnter.append('text').attr('class', 'fold-count');

    var nodeUpdate = nodeEnter.merge(nodeSel);

    nodeUpdate.transition().duration(duration)
      .attr('transform', function(d){ return 'translate(' + d.px + ',' + d.py + ')'; })
      .attr('opacity', 1);

    nodeUpdate.select('.node-circle')
      .attr('class', function(d){
        return 'node-circle' + (d.depth === 0 ? ' root-pulse' : '');
      })
      .transition().duration(duration)
      .attr('r', function(d){
        if(d.depth === 0) return 14;
        if(d._children) return 8;
        if(d.children) return 7;
        return 4;
      })
      .attr('fill', function(d){
        if(d._children) return 'var(--bg-secondary)';
        return getNodeColor(d);
      })
      .attr('stroke', function(d){ return getNodeColor(d); })
      .attr('stroke-width', function(d){
        if(d.depth === 0) return 3;
        if(d._children) return 2.5;
        return 2;
      });

    nodeUpdate.select('.node-text')
      .attr('dy', function(d){ return d.depth === 0 ? '-22px' : '0.35em'; })
      .attr('x', function(d){
        if(d.depth === 0) return 0;
        var angle = (d.x * 180 / Math.PI) % 360;
        var offset = getTextOffset(d);
        return angle > 90 && angle < 270 ? -offset : offset;
      })
      .attr('text-anchor', function(d){
        if(d.depth === 0) return 'middle';
        var angle = (d.x * 180 / Math.PI) % 360;
        return angle > 90 && angle < 270 ? 'end' : 'start';
      })
      .attr('font-size', function(d){
        if(d.depth === 0) return '16px';
        if(d.depth === 1) return '13px';
        if(d.depth === 2) return '11px';
        return '10px';
      })
      .attr('font-weight', function(d){
        return d.depth <= 1 ? '700' : '400';
      })
      .text(function(d){ return truncateText(d.data.name, d.depth); });

    nodeUpdate.select('.fold-count')
      .attr('dy', '0.35em')
      .attr('font-size', function(d){ return d.depth === 0 ? '10px' : '8px'; })
      .text(function(d){
        if(!d._children) return '';
        return countDescendants(d._children);
      });

    nodeUpdate.on('click', function(e, d){
      e.stopPropagation();
      if(d.children || d._children){
        toggleNode(d);
      } else if(d.data.slug){
        showModal(d.data.slug);
      }
    });

    nodes.forEach(function(d){
      d.x0 = d.x;
      d.y0 = d.y;
    });

    document.getElementById('status-info').textContent = nodes.length + ' 个节点';
  }

  function fitToScreen(){
    var svg = d3.select('#mindmap-svg');
    var width = svgEl.clientWidth;
    var height = svgEl.clientHeight;
    var nodeCount = rootHierarchy.descendants().length;
    var radius = Math.max(Math.min(width, height) * 0.42, nodeCount * 3.5);
    var scale = Math.min(width, height) / 2 / (radius + 80);
    scale = Math.min(scale, 1.5);
    svg.transition().duration(500).call(
      zoom.transform,
      d3.zoomIdentity.translate(width / 2, height / 2).scale(scale)
    );
  }

  function initRadialTree(){
    svgEl = document.getElementById('mindmap-svg');
    var width = svgEl.clientWidth;
    var height = svgEl.clientHeight;

    var svg = d3.select('#mindmap-svg');
    zoom = d3.zoom()
      .scaleExtent([0.1, 4])
      .on('zoom', function(e){
        gEl.attr('transform', e.transform);
      });

    svg.call(zoom);

    gEl = svg.append('g')
      .attr('transform', 'translate(' + width / 2 + ',' + height / 2 + ')');

    treeData = buildHeadingTree(headings);
    rootHierarchy = d3.hierarchy(treeData);

    expandAll(rootHierarchy);
    rootHierarchy.children.forEach(function(child){
      if(child.children){
        child.children.forEach(collapseAll);
      }
    });

    rootHierarchy.x0 = 0;
    rootHierarchy.y0 = 0;

    update(rootHierarchy);
    fitToScreen();

    document.getElementById('loading').style.display = 'none';

    var hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(function(){ hint.classList.remove('show'); }, 5000);
  }

  function setupToolbar(){
    document.getElementById('btn-expand-all').addEventListener('click', function(){
      expandAll(rootHierarchy);
      update(rootHierarchy);
      setTimeout(fitToScreen, duration + 50);
    });

    document.getElementById('btn-collapse-all').addEventListener('click', function(){
      rootHierarchy.children.forEach(function(child){
        collapseAll(child);
      });
      update(rootHierarchy);
      setTimeout(fitToScreen, duration + 50);
    });

    document.getElementById('btn-fit').addEventListener('click', fitToScreen);

    document.getElementById('btn-reset').addEventListener('click', function(){
      expandAll(rootHierarchy);
      rootHierarchy.children.forEach(function(child){
        if(child.children){
          child.children.forEach(collapseAll);
        }
      });
      update(rootHierarchy);
      setTimeout(fitToScreen, duration + 50);
    });
  }

  function setupModal(){
    document.getElementById('modal-close').addEventListener('click', hideModal);
    document.getElementById('modal-overlay').addEventListener('click', function(e){
      if(e.target === this) hideModal();
    });
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') hideModal();
    });
  }

  function setupTheme(){
    var saved = localStorage.getItem('theme');
    if(saved){
      document.documentElement.dataset.theme = saved;
    } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches){
      document.documentElement.dataset.theme = 'light';
    }
    updateHljsTheme();

    document.getElementById('btn-theme').addEventListener('click', function(){
      var current = document.documentElement.dataset.theme;
      var next = current === 'light' ? '' : 'light';
      if(next){
        document.documentElement.dataset.theme = next;
        localStorage.setItem('theme', next);
      } else {
        delete document.documentElement.dataset.theme;
        localStorage.setItem('theme', 'dark');
      }
      updateHljsTheme();
    });
  }

  function updateHljsTheme(){
    var link = document.getElementById('hljs-theme');
    var isLight = document.documentElement.dataset.theme === 'light';
    link.href = isLight
      ? 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css'
      : 'https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css';
  }

  async function init(){
    try{
      var resp = await fetch('ALL.md');
      if(!resp.ok) throw new Error('Failed to load ALL.md: ' + resp.status);
      markdownText = await resp.text();
      headings = parseHeadings(markdownText);
      setupTheme();
      initRadialTree();
      setupToolbar();
      setupModal();
    } catch(err){
      document.getElementById('loading').textContent = '加载失败: ' + err.message;
      document.getElementById('status-info').textContent = '错误';
      console.error(err);
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
