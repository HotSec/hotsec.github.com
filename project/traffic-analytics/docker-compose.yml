version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: ta-postgres
    environment:
      POSTGRES_DB: traffic_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: ta-clickhouse
    environment:
      CLICKHOUSE_DB: traffic_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse123", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7
    container_name: ta-redis
    command: redis-server --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - traffic-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pg_data:
    driver: local
  ch_data:
    driver: local
  redis_data:
    driver: local

networks:
  traffic-net:
    driver: bridge
